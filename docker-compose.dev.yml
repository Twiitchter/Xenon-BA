# ═══════════════════════════════════════════════════════════════════════════════
# XeonB CRM — Development Docker Compose (3 Containers)
# ═══════════════════════════════════════════════════════════════════════════════
# Services:
#   - frontend (Vite dev server)
#   - backend (Express + TypeScript)
#   - mssql (SQL Server 2022)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  frontend:
    image: node:20-alpine
    working_dir: /app/client
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3001"
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3001"
    volumes:
      - .:/app
      - frontend_node_modules:/app/client/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:server"
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DB_DIALECT=mssql
      - DB_HOST=mssql
      - DB_PORT=1433
      - DB_USER=sa
      - DB_ENCRYPT=false
      - DB_TRUST_CERT=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Developer
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mssqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
  mssqldata:
