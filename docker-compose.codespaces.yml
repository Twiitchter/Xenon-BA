# ═══════════════════════════════════════════════════════════════════════════════
# XeonB CRM — GitHub Codespaces Docker Compose (Docker-in-Docker)
# ═══════════════════════════════════════════════════════════════════════════════
# This configuration is used when running in GitHub Codespaces with Docker-in-Docker.
# The app container serves as the development environment where you can run
# docker commands, and the database runs as a sibling container via DinD.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── Application Development Container ─────────────────────────────────────
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - CODESPACES=true
    network_mode: host
    # Docker-in-Docker is enabled via the devcontainer feature
    # This allows running docker commands inside the container

  # ── SQL Server (MSSQL) Database ───────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Developer
    volumes:
      - mssqldata-codespaces:/var/opt/mssql
    ports:
      - "1433:1433"

volumes:
  mssqldata-codespaces:
